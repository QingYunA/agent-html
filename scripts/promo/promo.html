<title>agent-html · 26s promo storyboard</title>
<!--
  Storyboard for the 26-second promo video. It is NOT a normal animated page:
  every visual is a pure function of time `t` (seconds), set by render(t).
  Story time is authored on 4–30s: the video opens straight on the landing page
  (OPEN = 4), so video time 0 is story time 4.
  scripts/generate-promo-video.mjs steps t at 30 fps, screenshots each frame,
  synthesises the soundtrack from window.CUES and muxes both with ffmpeg,
  so the output is deterministic.

  Preview in a browser: promo.html?lang=zh&t=8.5   (t is video time)
  Timing sits on a 120 BPM grid (1 beat = 0.5s, 1 bar = 2s) so cuts land on the music.
-->
<link rel="stylesheet" href="fonts/noto-sans-sc-subset.css">
<style>

  @font-face { font-family: "Inter"; font-weight: 600; src: url("fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 700; src: url("fonts/inter-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("fonts/inter-latin-800-normal.woff2") format("woff2"); }

  :root {

    --sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", "Noto Sans SC", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: var(--sans); color: var(--fg); -webkit-font-smoothing: antialiased; }
  .stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  .scene { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
  :lang(zh) .tlist { top: 330px; gap: 2px; }

  /* Light backdrop shared by scenes 2–5 */
  .backdrop { position: absolute; inset: 0; }
  .backdrop::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#e4e4e7 1.4px, transparent 1.4px); background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000, transparent 80%); }
  .glow { position: absolute; left: 50%; top: -260px; width: 1600px; height: 900px; transform: translateX(-50%); filter: blur(30px);
    background: radial-gradient(closest-side at 30% 55%, rgba(99,102,241,.22), transparent), radial-gradient(closest-side at 70% 45%, rgba(139,92,246,.18), transparent), radial-gradient(closest-side at 50% 80%, rgba(6,182,212,.14), transparent); }

  .dot { width: 13px; height: 13px; border-radius: 99px; }

  /* Scene 2 — brand + install */
  .brand { position: absolute; left: 0; right: 0; top: 170px; display: flex; align-items: center; justify-content: center; gap: 22px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.35); }
  .brand span { font-size: 54px; font-weight: 800; letter-spacing: -0.04em; }
  .headline { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 104px; font-weight: 800; letter-spacing: -0.05em; line-height: 1.08; }
  .grad { background: linear-gradient(92deg, var(--indigo), var(--violet) 45%, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; font-size: 34px; color: var(--muted); font-weight: 500; }
  .pill { position: absolute; left: 50%; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 16px; height: 88px; padding: 0 16px 0 34px; background: var(--card);

  .titem .num { font-family: var(--mono); font-size: 20px; color: #a1a1aa; width: 34px; }
  .titem .nm { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; color: #a1a1aa; }
  .titem .ds { font-size: 18px; color: #a1a1aa; margin-top: 2px; }
  .titem.on { background: var(--card); border-color: var(--border); box-shadow: 0 16px 40px -22px rgba(0,0,0,.35); }
  .titem.on .nm { color: var(--fg); }
  .titem.on .ds { color: var(--muted); }
  .titem.on .num { color: var(--indigo); }
  .new { font-size: 15px; font-weight: 700; color: var(--ok); background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 99px; padding: 3px 10px; margin-left: 10px; vertical-align: 5px; }

  .window { position: absolute; background: var(--card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; box-shadow: 0 50px 100px -40px rgba(0,0,0,.35), 0 10px 30px -15px rgba(0,0,0,.15); }
  .wbar { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: var(--secondary); border-bottom: 1px solid var(--border); }
  .wdots { display: flex; gap: 9px; }

  .wview { position: relative; overflow: hidden; background: var(--bg); }

  #win3 { left: 700px; top: 150px; width: 1110px; height: 800px; }

  /* Scene 4 — features */
  .s4-title { position: absolute; left: 0; right: 0; top: 80px; text-align: center; font-size: 60px; font-weight: 800; letter-spacing: -0.045em; }

  .tag { position: absolute; font-size: 22px; font-weight: 700; padding: 10px 18px; border-radius: 12px; color: #fafafa; background: #18181b; }

</style>

<script>
  // ---------- copy (en / zh) ----------
  const LANG = new URLSearchParams(location.search).get('lang') === 'zh' ? 'zh' : 'en';
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  const T = {
    en: {
      head2: 'Clean, single-file HTML<br>for your <span class="grad">coding agents.</span>',
      sub2: 'Zero npm · zero CDN · opens offline with a double-click', copy: 'Copy', more: '70+ agents via skills.sh',
      s3title: '7 templates.<br>Zero guesswork.<small>Pick a layout instead of letting the model improvise one.</small>',
      s4title: 'Built for the loop between you <span class="grad">and your agent.</span>',
      tagLight: '☀ Light', tagDark: '☾ Dark, built in',
      f1b: '0 npm · 0 CDN', f1s: 'One file. Opens offline, in any browser, forever.',
      f2b: 'Copy back to your agent', f2s: 'Verdicts, triage and forms export as Markdown.',
      f3b: '8 pure-SVG charts', f3s: 'Plus 32 icons, tabs and form controls. No chart libraries.',
      f4b: 'Lint-gated output', f4s: 'An offline validator checks every page before you see it.',
      cta5: 'Stop shipping<br><span class="grad">walls of Markdown.</span>',
      templates: [
        ['report', 'Report', 'Reviews, RFCs and postmortems'],
        ['dashboard', 'Dashboard', 'KPIs, SVG charts, filterable tables'],
        ['inspector', 'Inspector', 'Master-detail trace & log viewer'],
        ['compare', 'Compare', 'A/B evals with a clear verdict'],
        ['timeline', 'Timeline', 'Incidents, releases, changelogs'],
        ['kanban', 'Kanban', 'Drag-and-drop triage board'],
        ['review', 'Review', 'git diff → line-level findings'],
      ],
    },
    zh: {
      head2: '让 AI 生成<br><span class="grad">干净、好看</span>的单文件 HTML',
      sub2: '零 npm · 零 CDN · 双击即开，断网也能用', copy: '复制', more: '70+ 款 Agent（skills.sh）',
      s3title: '7 套模板，<br>不再瞎排版。<small>直接套用现成版式，不让模型自由发挥。</small>',
      s4title: '为你和 Agent 之间的 <span class="grad">闭环协作</span> 而生',
      tagLight: '☀ 浅色', tagDark: '☾ 深色，内置',
      f1b: '0 npm · 0 CDN', f1s: '一个文件，离线打开，任何浏览器都能看。',
      f2b: '结果一键复制回 Agent', f2s: '审查结论、分拣结果、表单都能导出为 Markdown。',
      f3b: '8 种纯 SVG 图表', f3s: '外加 32 个图标、标签页与表单控件，不用任何图表库。',
      f4b: '自带质量门禁', f4s: '离线校验器会在你看到之前先检查每一页。',
      cta5: '别再让 Agent<br>甩给你 <span class="grad">一堵 Markdown 墙。</span>',
      templates: [
        ['report', '报告 Report', '评审、复盘、技术方案'],
        ['dashboard', '数据面板 Dashboard', '指标卡、SVG 图表、可筛选表格'],
        ['inspector', '审查工作台 Inspector', '日志与 Trace 双栏查看'],
        ['compare', '对比 Compare', 'A/B 评测，结论一目了然'],
        ['timeline', '时间线 Timeline', '事故复盘、版本记录'],
        ['kanban', '看板 Kanban', '拖拽分拣任务与缺陷'],
        ['review', '代码审查 Review', 'git diff → 逐行标出问题'],
      ],
    },
  }[LANG];
  document.querySelectorAll('[data-t]').forEach((el) => { el.innerHTML = T[el.dataset.t]; });

  // ---------- timeline helpers ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  // fade in over [a, a+fi], hold, fade out over [b-fo, b]
  const win = (t, a, b, fi = 0.4, fo = 0.4) => Math.min(easeOut(prog(t, a, a + fi)), 1 - easeInOut(prog(t, b - fo, b)));
  const $ = (id) => document.getElementById(id);
  const set = (el, o, y = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translateY(${y}px) scale(${s})`; };
  const setX = (el, o, y = 0, s = 1) => { el.style.opacity = o; el.style.transform = `translateX(-50%) translateY(${y}px) scale(${s})`; };
  const rise = (el, t, a, b, dy = 20) => { const p = easeOut(prog(t, a, b)); set(el, p, dy * (1 - p)); return p; };

  // Scene windows (story seconds) on the 120 BPM grid: cuts at 8, 20 and 24.
  const OPEN = 4, END = 30;            // the video shows story time OPEN..END
  window.OPEN = OPEN;
  window.LENGTH = END - OPEN;         // video length in seconds, read by the generator
  const S = { s2: [4, 8.05], s3: [7.95, 20.05], s4: [19.95, 24.05], s5: [23.95, 30.5] };
  const SLIDE = 1.5, S3_START = 8.5;   // one template every 3 beats
  const CMD = 'npx skills add QingYunA/agent-html';
  const TYPE = [5.0, 6.4];             // typing window for the install command

  // ---------- sound cues, read by the generator to build the soundtrack ----------
  // Authored in storyboard time; window.applySync() maps them onto a real track's beat grid.
  const NOMINAL_CUES = {
    bpm: 120,
    impacts: [8, 24],                                      // scene cuts that hit hard
    risers: [[7.0, 8], [19.0, 20], [23.0, 24]],            // noise swells into each cut
    ticks: T.templates.slice(1).map((_, i) => S3_START + (i + 1) * SLIDE), // template changes
    typing: Array.from({ length: CMD.length }, (_, i) => TYPE[0] + (i / CMD.length) * (TYPE[1] - TYPE[0])),
    whoosh: 20.8,                                          // light → dark wipe
    pops: [22.0, 22.5, 23.0, 23.5],                        // feature cards
  };

  window.NOMINAL_CUES = NOMINAL_CUES;

  // ---------- beat sync: warp storyboard time onto a real track ----------
  // Anchors pair real time (seconds into the music) with storyboard time. Cuts snap to the
  // nearest downbeat, template changes and feature cards to the nearest beat; everything
  // in between is stretched linearly, so every animation and cue moves with them.
  let ANCHORS = [[0, OPEN], [END - OPEN, END]];
  const interp = (x, pts, from, to) => {
    for (let i = 1; i < pts.length; i++) {
      const [a, b] = [pts[i - 1], pts[i]];
      if (x <= b[from] || i === pts.length - 1) {
        const k = (x - a[from]) / ((b[from] - a[from]) || 1);
        return a[to] + k * (b[to] - a[to]);
      }
    }
    return x;
  };
  const toStory = (t) => interp(t, ANCHORS, 0, 1);
  const toReal = (n) => interp(n, ANCHORS, 1, 0);
  const mapCues = (c) => ({
    ...c,
    impacts: c.impacts.map(toReal), risers: c.risers.map(([a, b]) => [toReal(a), toReal(b)]),
    ticks: c.ticks.map(toReal), typing: c.typing.map(toReal), whoosh: toReal(c.whoosh),
    pops: c.pops.map(toReal),
  });
  window.CUES = mapCues(NOMINAL_CUES);

  window.applySync = (sync) => {
    const nearest = (list, x, maxDist) => {
      let best = x, d = Infinity;
      for (const v of list) if (Math.abs(v - x) < d) { d = Math.abs(v - x); best = v; }
      return d <= maxDist ? best : x;
    };
    const beat = 60 / sync.bpm, bar = beat * 4;
    const pts = [[0, OPEN]];
    const push = (real, story) => { if (real > pts[pts.length - 1][0] + 0.2) pts.push([real, story]); };
    const cut = (n) => nearest(sync.bars, n - OPEN, bar * 0.6);   // snap each scene cut to the nearest "one"
    const [c8, c20, c24] = [8, 20, 24].map(cut);
    push(c8, 8);
    // template changes: spread proportionally across the section, then snap to beats
    for (let k = 1; k < 7; k++) {
      const n = S3_START + k * SLIDE;
      push(nearest(sync.beats, c8 + (n - 8) * (c20 - c8) / 12, beat * 0.6), n);
    }
    push(c20, 20);
    NOMINAL_CUES.pops.forEach((n) => push(nearest(sync.beats, c20 + (n - 20) * (c24 - c20) / 4, beat * 0.6), n));
    push(c24, 24);
    pts.push([Math.max(END - OPEN, pts[pts.length - 1][0] + 1), END]);
    ANCHORS = pts;
    window.CUES = { ...mapCues(NOMINAL_CUES), bpm: sync.bpm };
    return ANCHORS;
  };

  $('tlist').innerHTML = T.templates.map(([k, n, d], i) =>
    `<div class="titem" id="ti-${k}"><span class="num">0${i + 1}</span><div><div class="nm">${n}${k === 'review' ? '<span class="new">NEW</span>' : ''}</div><div class="ds">${d}</div></div></div>`).join('');
  $('view3').innerHTML = T.templates.map(([k]) => `<img class="shot" id="shot-${k}" src="../../assets/screenshots/${LANG}/${k}.png" alt="">`).join('');
  $('lightShot').src = `../../assets/screenshots/${LANG}/dashboard.png`;
  $('url4').textContent = `templates/${LANG}/dashboard.html`;

  function render(realT) {
    const t = toStory(realT);
    // ---- Scene 2 ----
    $('s2').style.opacity = win(t, S.s2[0], S.s2[1], 0.01, 0.35);
    const bp = easeOut(prog(t, 4.0, 4.45));
    set($('brand'), bp, 20 * (1 - bp), 0.9 + 0.1 * bp);
    rise($('head2'), t, 4.2, 4.8, 30);
    rise($('sub2'), t, 4.5, 5.0, 16);
    const pp = easeOut(prog(t, 4.7, 5.1));
    setX($('pill2'), pp, 20 * (1 - pp));
    $('typed').textContent = CMD.slice(0, Math.round(prog(t, TYPE[0], TYPE[1]) * CMD.length));
    $('caret').style.opacity = (t < TYPE[1] || Math.floor(t * 2) % 2 === 0) ? 1 : 0;
    const chips = $('agents').children;
    for (let i = 0; i < chips.length; i++) {
      const p = easeOut(prog(t, 6.5 + i * 0.12, 6.9 + i * 0.12));
      chips[i].style.opacity = p;
      chips[i].style.transform = `translateY(${14 * (1 - p)}px)`;
    }

    // ---- Scene 3 ----
    $('s3').style.opacity = win(t, S.s3[0], S.s3[1], 0.35, 0.35);
    rise($('s3title'), t, 8.05, 8.6, 24);
    const wp = easeOut(prog(t, 8.1, 8.7));
    set($('win3'), wp, 40 * (1 - wp));
    const idx = clamp(Math.floor((t - S3_START) / SLIDE), 0, T.templates.length - 1);
    T.templates.forEach(([k], i) => {
      const item = $('ti-' + k);
      item.classList.toggle('on', i === idx && t >= S3_START - 0.2);
      const ip = easeOut(prog(t, 8.3 + i * 0.07, 8.7 + i * 0.07));
      item.style.opacity = ip;
      item.style.transform = `translateX(${-20 * (1 - ip)}px)`;
      // Every screenshot fills the viewport, so a slide simply fades in above the previous one.
      const start = S3_START + i * SLIDE;
      const shotIn = i === 0 ? 1 : easeInOut(prog(t, start - 0.2, start + 0.15));
      const shot = $('shot-' + k);
      shot.style.opacity = i <= idx + 1 && i >= idx - 1 ? shotIn : 0;
      shot.style.transform = `scale(${1.0 + 0.05 * prog(t, start - 0.2, start + SLIDE + 0.2)})`;
      shot.style.zIndex = i;
    });
    $('url3').textContent = `templates/${LANG}/${T.templates[idx][0]}.html`;

    // ---- Scene 4 ----
    $('s4').style.opacity = win(t, S.s4[0], S.s4[1], 0.35, 0.35);
    rise($('s4title'), t, 20.0, 20.5, 20);
    const w4 = easeOut(prog(t, 20.05, 20.6));
    set($('win4'), w4, 36 * (1 - w4), 0.96 + 0.04 * w4);
    const wipe = easeInOut(prog(t, 20.8, 21.8));
    $('dark4').style.clipPath = `inset(0 0 0 ${(1 - wipe) * 100}%)`;
    $('wipe').style.left = `calc(${(1 - wipe) * 100}% - 1px)`;
    $('wipe').style.opacity = wipe > 0 && wipe < 1 ? 1 : 0;
    $('tagLight').style.opacity = easeOut(prog(t, 20.3, 20.7)) * (1 - easeOut(prog(t, 21.6, 21.9)));
    $('tagDark').style.opacity = easeOut(prog(t, 21.6, 22.0));
    ['f1', 'f2', 'f3', 'f4'].forEach((id, i) => {
      const p = easeOut(prog(t, CUES.pops[i], CUES.pops[i] + 0.45));
      set($(id), p, 24 * (1 - p), 0.94 + 0.06 * p);
    });

    // ---- Scene 5 ----
    $('s5').style.opacity = win(t, S.s5[0], S.s5[1], 0.3, 0.01);
    const b5 = easeOut(prog(t, 24.0, 24.5));
    set($('brand5'), b5, 20 * (1 - b5), 0.92 + 0.08 * b5);
    rise($('cta5'), t, 24.2, 24.9, 30);
    const p5 = easeOut(prog(t, 25.0, 25.5));
    setX($('pill5'), p5, 20 * (1 - p5));
    rise($('links5'), t, 25.5, 26.0, 14);
  }

  window.render = render;
  // Dark screenshot for the scene-4 wipe is injected by the generator (it renders the template in dark mode).
  window.setDarkShot = (src) => new Promise((res) => { const img = $('darkShot'); img.onload = res; img.onerror = res; img.src = src; });
  const q = new URLSearchParams(location.search);
  render(q.has('t') ? parseFloat(q.get('t')) : 8);
</script>
</body>
