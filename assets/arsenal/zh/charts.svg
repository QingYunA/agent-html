<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; rx: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #18181b; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #71717a; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    </style>
    <!-- Minimalist Zinc Area Gradient (shadcn) -->
    <linearGradient id="areaGradZincZh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Outer Canvas Container -->
  <rect width="920" height="440" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />

  <!-- ================= ROW 1 ================= -->

  <!-- Chart 1: Area Trend Curve -->
  <g transform="translate(16, 16)">
    <rect width="280" height="194" class="card-bg" />
    <text x="16" y="28" class="text-title">24h 请求吞吐量 (TPS)</text>
    <text x="264" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" font-weight="600" fill="#18181b">↑ +18.4%</text>
    
    <!-- SVG Area Curve -->
    <g transform="translate(16, 48)">
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38 L 248 130 L 0 130 Z" fill="url(#areaGradZincZh)" />
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
      <circle cx="135" cy="50" r="3" fill="#ffffff" stroke="#18181b" stroke-width="2" />
      <circle cx="200" cy="24" r="3.5" fill="#18181b" stroke="#ffffff" stroke-width="2" />
      <!-- Baseline -->
      <line x1="0" y1="130" x2="248" y2="130" stroke="#f4f4f5" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 2: Column Histogram -->
  <g transform="translate(312, 16)">
    <rect width="280" height="194" class="card-bg" />
    <text x="16" y="28" class="text-title">阶段响应延迟分布 (ms)</text>
    <rect x="230" y="16" width="34" height="18" rx="4" fill="#f4f4f5" />
    <text x="247" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#71717a">P95</text>

    <!-- Bars (Zinc Contrast) -->
    <g transform="translate(16, 54)">
      <rect x="10" y="76" width="32" height="44" rx="3" fill="#e4e4e7" />
      <text x="26" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="500" fill="#71717a" text-anchor="middle">24ms</text>
      
      <rect x="60" y="48" width="32" height="72" rx="3" fill="#a1a1aa" />
      <text x="76" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#18181b" text-anchor="middle">48ms</text>
      
      <!-- Peak Bar (Primary Zinc) -->
      <rect x="110" y="18" width="32" height="102" rx="3" fill="#18181b" />
      <text x="126" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="700" fill="#18181b" text-anchor="middle">92ms</text>
      
      <rect x="160" y="60" width="32" height="60" rx="3" fill="#a1a1aa" />
      <text x="176" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#18181b" text-anchor="middle">35ms</text>
      
      <rect x="210" y="86" width="32" height="34" rx="3" fill="#e4e4e7" />
      <text x="226" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="500" fill="#71717a" text-anchor="middle">18ms</text>
      <line x1="0" y1="120" x2="248" y2="120" stroke="#f4f4f5" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 3: Multi-Segment Donut -->
  <g transform="translate(608, 16)">
    <rect width="296" height="194" class="card-bg" />
    <text x="16" y="28" class="text-title">集群健康度全景占比</text>
    <rect x="216" y="16" width="64" height="18" rx="4" fill="#f4f4f5" />
    <text x="248" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#18181b">99.8% 达标</text>

    <!-- Donut SVG (Zinc Tri-Tone) -->
    <g transform="translate(16, 50)">
      <circle cx="60" cy="65" r="46" fill="none" stroke="#f4f4f5" stroke-width="14" />
      <!-- Circumference = 2*PI*46 ≈ 289.0 -->
      <!-- 65%: #18181b (zinc-900) -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#18181b" stroke-width="14" stroke-dasharray="187.8 289" stroke-dashoffset="0" transform="rotate(-90 60 65)" />
      <!-- 25%: #71717a (zinc-500) -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#71717a" stroke-width="14" stroke-dasharray="72.2 289" stroke-dashoffset="-187.8" transform="rotate(-90 60 65)" />
      <!-- 10%: #d4d4d8 (zinc-300) -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#d4d4d8" stroke-width="14" stroke-dasharray="28.9 289" stroke-dashoffset="-260" transform="rotate(-90 60 65)" />
      
      <!-- Center text -->
      <text x="60" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16px" font-weight="700" fill="#18181b">1,280</text>
      <text x="60" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" fill="#71717a">节点</text>

      <!-- Legend -->
      <g transform="translate(130, 24)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
        <circle cx="6" cy="12" r="3.5" fill="#18181b" />
        <text x="16" y="16" fill="#71717a">正常运行 65%</text>
        <text x="124" y="16" text-anchor="end" font-weight="600" fill="#18181b">832</text>

        <circle cx="6" cy="38" r="3.5" fill="#71717a" />
        <text x="16" y="42" fill="#71717a">负载预警 25%</text>
        <text x="124" y="42" text-anchor="end" font-weight="600" fill="#18181b">320</text>

        <circle cx="6" cy="64" r="3.5" fill="#d4d4d8" />
        <text x="16" y="68" fill="#71717a">异常降级 10%</text>
        <text x="124" y="68" text-anchor="end" font-weight="600" fill="#18181b">128</text>
      </g>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Chart 4: Dual Line Trend Ingress vs Egress -->
  <g transform="translate(16, 226)">
    <rect width="280" height="198" class="card-bg" />
    <text x="16" y="28" class="text-title">出入网络流量对冲</text>
    <g transform="translate(146, 20)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px">
      <text x="0" y="8" fill="#18181b" font-weight="600">— 入向 1.4G</text>
      <text x="68" y="8" fill="#71717a">┄ 出向 860M</text>
    </g>

    <g transform="translate(16, 52)">
      <!-- Ingress Solid Line -->
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40 L 248 130 L 0 130 Z" fill="url(#areaGradZincZh)" />
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40" fill="none" stroke="#18181b" stroke-width="2" stroke-linecap="round" />
      <!-- Egress Dashed Line -->
      <path d="M 0 100 Q 40 80, 80 92 T 160 65 T 220 54 T 248 70" fill="none" stroke="#71717a" stroke-width="1.8" stroke-dasharray="4 4" stroke-linecap="round" />
      <circle cx="220" cy="20" r="3" fill="#18181b" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="220" cy="54" r="3" fill="#71717a" stroke="#ffffff" stroke-width="1.5" />
      <line x1="0" y1="130" x2="248" y2="130" stroke="#f4f4f5" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 5: Horizontal Ranking Bar -->
  <g transform="translate(312, 226)">
    <rect width="280" height="198" class="card-bg" />
    <text x="16" y="28" class="text-title">核心模块耗时排行</text>
    <text x="264" y="28" text-anchor="end" class="text-sub" font-size="10px">P95 ms</text>

    <!-- Bars (Zinc hierarchy) -->
    <g transform="translate(16, 44)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
      <!-- Item 1 (Bottleneck) -->
      <text x="0" y="14" fill="#18181b" font-weight="600">DB 连接池等待</text>
      <text x="248" y="14" text-anchor="end" font-weight="700" fill="#18181b">280ms</text>
      <rect x="0" y="20" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="20" width="210" height="6" rx="3" fill="#18181b" />

      <!-- Item 2 -->
      <text x="0" y="48" fill="#18181b">大模型首字生成 (TTFT)</text>
      <text x="248" y="48" text-anchor="end" font-weight="600" fill="#71717a">195ms</text>
      <rect x="0" y="54" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="54" width="154" height="6" rx="3" fill="#71717a" />

      <!-- Item 3 -->
      <text x="0" y="82" fill="#18181b">网关鉴权校验 (JWT)</text>
      <text x="248" y="82" text-anchor="end" font-weight="500" fill="#71717a">48ms</text>
      <rect x="0" y="88" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="88" width="55" height="6" rx="3" fill="#a1a1aa" />

      <!-- Item 4 -->
      <text x="0" y="116" fill="#18181b">边缘静态资源缓存</text>
      <text x="248" y="116" text-anchor="end" font-weight="500" fill="#71717a">12ms</text>
      <rect x="0" y="122" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="122" width="20" height="6" rx="3" fill="#d4d4d8" />
    </g>
  </g>

  <!-- Chart 6: Semi-Circle Gauge -->
  <g transform="translate(608, 226)">
    <rect width="296" height="198" class="card-bg" />
    <text x="16" y="28" class="text-title">集群内存占用水位</text>
    <rect x="226" y="16" width="54" height="18" rx="4" fill="#f4f4f5" />
    <text x="253" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#71717a">正常</text>

    <!-- Semi-Circle Gauge (Zinc Arc) -->
    <g transform="translate(28, 48)">
      <!-- Radius = 70, Half Circumference = 219.9 -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="#f4f4f5" stroke-width="14" stroke-dasharray="219.9 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      <!-- Active Arc 78.4%: length = 172.4 in #18181b -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="#18181b" stroke-width="14" stroke-dasharray="172.4 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      
      <!-- Values -->
      <text x="120" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24px" font-weight="800" fill="#18181b">78.4%</text>
      <text x="120" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a">已使用 15.6 / 20 TB</text>
      <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#a1a1aa" text-anchor="middle">0%</text>
      <text x="200" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#a1a1aa" text-anchor="middle">100%</text>
    </g>
  </g>
</svg>
