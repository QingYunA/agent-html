<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="100%" height="auto">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
      .section-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #71717a; letter-spacing: 0.08em; text-transform: uppercase; }
      .btn-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 500; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="290" rx="14" class="card" />

  <!-- Section 1: Core Variants -->
  <text x="28" y="38" class="section-label">按钮核心变体 (BUTTON VARIANTS)</text>

  <!-- Primary Button -->
  <g transform="translate(28, 52)">
    <rect width="136" height="36" rx="6" fill="#18181b" />
    <text x="68" y="23" fill="#ffffff" text-anchor="middle" class="btn-text">Primary 主要操作</text>
  </g>

  <!-- Secondary Button -->
  <g transform="translate(176, 52)">
    <rect width="144" height="36" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="0.5" />
    <text x="72" y="23" fill="#18181b" text-anchor="middle" class="btn-text">Secondary 辅助</text>
  </g>

  <!-- Outline Button -->
  <g transform="translate(332, 52)">
    <rect width="136" height="36" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
    <text x="68" y="23" fill="#18181b" text-anchor="middle" class="btn-text">Outline 轮廓</text>
  </g>

  <!-- Ghost Button -->
  <g transform="translate(480, 52)">
    <rect width="128" height="36" rx="6" fill="#f4f4f5" opacity="0.6" />
    <text x="64" y="23" fill="#71717a" text-anchor="middle" class="btn-text">Ghost 幽灵</text>
  </g>

  <!-- Destructive Button -->
  <g transform="translate(620, 52)">
    <rect width="140" height="36" rx="6" fill="#ef4444" />
    <text x="70" y="23" fill="#ffffff" text-anchor="middle" class="btn-text">Destructive 危险</text>
  </g>

  <!-- Section 2: Buttons with Icons & Sizes -->
  <text x="28" y="128" class="section-label">带图标与尺寸组合 (ICONS &amp; SIZES)</text>

  <!-- Button with Download Icon -->
  <g transform="translate(28, 142)">
    <rect width="144" height="34" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
    <svg x="14" y="10" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="2">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
      <polyline points="7 10 12 15 17 10" />
      <line x1="12" y1="15" x2="12" y2="3" />
    </svg>
    <text x="82" y="22" fill="#18181b" text-anchor="middle" class="btn-text" font-size="12">下载 PDF 报告</text>
  </g>

  <!-- Button with Search Icon (Primary sm) -->
  <g transform="translate(184, 142)">
    <rect width="132" height="34" rx="6" fill="#18181b" />
    <svg x="14" y="10" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.3-4.3" />
    </svg>
    <text x="76" y="22" fill="#ffffff" text-anchor="middle" class="btn-text" font-size="12">即时搜索</text>
  </g>

  <!-- Button with Alert Icon (Destructive sm) -->
  <g transform="translate(328, 142)">
    <rect width="138" height="34" rx="6" fill="#ef4444" />
    <svg x="12" y="10" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2">
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="12" />
      <line x1="12" y1="16" x2="12.01" y2="16" />
    </svg>
    <text x="80" y="22" fill="#ffffff" text-anchor="middle" class="btn-text" font-size="12">阻断发布流程</text>
  </g>

  <!-- Square Icon Button (Settings) -->
  <g transform="translate(478, 142)">
    <rect width="34" height="34" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
    <svg x="10" y="10" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>
  </g>

  <!-- Square Icon Button (Refresh) -->
  <g transform="translate(520, 142)">
    <rect width="34" height="34" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1.2" />
    <svg x="10" y="10" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2">
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
      <path d="M3 3v5h5" />
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
      <path d="M16 21h5v-5" />
    </svg>
  </g>

  <!-- Section 3: Semantic Status Badges -->
  <text x="28" y="218" class="section-label">语义状态徽章 (STATUS BADGES)</text>

  <!-- 200 OK Badge -->
  <g transform="translate(28, 232)">
    <rect width="130" height="24" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <circle cx="16" cy="12" r="3" fill="#16a34a" />
    <text x="74" y="16" fill="#16a34a" text-anchor="middle" class="badge-text">200 OK 正常运行</text>
  </g>

  <!-- Warning Badge -->
  <g transform="translate(170, 232)">
    <rect width="130" height="24" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
    <circle cx="16" cy="12" r="3" fill="#d97706" />
    <text x="74" y="16" fill="#b45309" text-anchor="middle" class="badge-text">Warning 资源预警</text>
  </g>

  <!-- Danger Badge -->
  <g transform="translate(312, 232)">
    <rect width="130" height="24" rx="12" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
    <circle cx="16" cy="12" r="3" fill="#dc2626" />
    <text x="74" y="16" fill="#dc2626" text-anchor="middle" class="badge-text">Critical 阻断性异常</text>
  </g>

  <!-- Info Badge -->
  <g transform="translate(454, 232)">
    <rect width="138" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <circle cx="16" cy="12" r="3" fill="#2563eb" />
    <text x="78" y="16" fill="#2563eb" text-anchor="middle" class="badge-text">In Progress 流式处理</text>
  </g>

  <!-- Neutral Badge -->
  <g transform="translate(604, 232)">
    <rect width="110" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
    <text x="55" y="16" fill="#71717a" text-anchor="middle" class="badge-text">Default 中性状态</text>
  </g>
</svg>
