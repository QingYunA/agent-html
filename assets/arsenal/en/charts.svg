<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #18181b; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #71717a; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    </style>
    <!-- Area Trend Gradients -->
    <linearGradient id="areaGradIndigoEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="dualAreaGradEn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="gaugeGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="440" rx="14" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" />

  <!-- ================= ROW 1 ================= -->

  <!-- Chart 1: Area Trend Curve -->
  <g transform="translate(16, 16)">
    <rect width="280" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">24h Throughput (TPS)</text>
    <text x="264" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" font-weight="700" fill="#16a34a">↑ +18.4%</text>
    
    <!-- SVG Area Curve -->
    <g transform="translate(16, 48)">
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38 L 248 130 L 0 130 Z" fill="url(#areaGradIndigoEn)" />
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="135" cy="50" r="3.5" fill="#ffffff" stroke="#6366f1" stroke-width="2" />
      <circle cx="200" cy="24" r="4" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
      <line x1="0" y1="130" x2="248" y2="130" stroke="#e4e4e7" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 2: Column Histogram -->
  <g transform="translate(312, 16)">
    <rect width="280" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">Latency by Stage (ms)</text>
    <rect x="230" y="16" width="34" height="18" rx="9" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="0.5" />
    <text x="247" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#71717a">P95</text>

    <!-- Bars -->
    <g transform="translate(16, 54)">
      <!-- Bar 1 -->
      <rect x="10" y="76" width="32" height="44" rx="4" fill="#94a3b8" opacity="0.6" />
      <text x="26" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#71717a" text-anchor="middle">24ms</text>
      <!-- Bar 2 -->
      <rect x="60" y="48" width="32" height="72" rx="4" fill="#6366f1" opacity="0.8" />
      <text x="76" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#18181b" text-anchor="middle">48ms</text>
      <!-- Bar 3 (Peak) -->
      <rect x="110" y="18" width="32" height="102" rx="4" fill="#8b5cf6" />
      <text x="126" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="700" fill="#8b5cf6" text-anchor="middle">92ms</text>
      <!-- Bar 4 -->
      <rect x="160" y="60" width="32" height="60" rx="4" fill="#6366f1" opacity="0.8" />
      <text x="176" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#18181b" text-anchor="middle">35ms</text>
      <!-- Bar 5 -->
      <rect x="210" y="86" width="32" height="34" rx="4" fill="#94a3b8" opacity="0.6" />
      <text x="226" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#71717a" text-anchor="middle">18ms</text>
      <line x1="0" y1="120" x2="248" y2="120" stroke="#e4e4e7" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 3: Multi-Segment Donut -->
  <g transform="translate(608, 16)">
    <rect width="296" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">Node Health Allocation</text>
    <rect x="210" y="16" width="70" height="18" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8" />
    <text x="245" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#16a34a">99.8% SLA</text>

    <!-- Donut SVG (center 60, 65) -->
    <g transform="translate(16, 50)">
      <circle cx="60" cy="65" r="46" fill="none" stroke="#f4f4f5" stroke-width="15" />
      <!-- Circumference = 2*PI*46 ≈ 289.0 -->
      <!-- 65%: 187.8 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#10b981" stroke-width="15" stroke-dasharray="187.8 289" stroke-dashoffset="0" transform="rotate(-90 60 65)" />
      <!-- 25%: 72.2 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#f59e0b" stroke-width="15" stroke-dasharray="72.2 289" stroke-dashoffset="-187.8" transform="rotate(-90 60 65)" />
      <!-- 10%: 28.9 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#f43f5e" stroke-width="15" stroke-dasharray="28.9 289" stroke-dashoffset="-260" transform="rotate(-90 60 65)" />
      
      <!-- Center text -->
      <text x="60" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16px" font-weight="700" fill="#18181b">1,280</text>
      <text x="60" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" fill="#71717a">Nodes</text>

      <!-- Legend -->
      <g transform="translate(130, 24)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
        <circle cx="6" cy="12" r="3.5" fill="#10b981" />
        <text x="16" y="16" fill="#71717a">Normal 65%</text>
        <text x="124" y="16" text-anchor="end" font-weight="700" fill="#18181b">832</text>

        <circle cx="6" cy="38" r="3.5" fill="#f59e0b" />
        <text x="16" y="42" fill="#71717a">Warning 25%</text>
        <text x="124" y="42" text-anchor="end" font-weight="700" fill="#18181b">320</text>

        <circle cx="6" cy="64" r="3.5" fill="#f43f5e" />
        <text x="16" y="68" fill="#71717a">Degraded 10%</text>
        <text x="124" y="68" text-anchor="end" font-weight="700" fill="#18181b">128</text>
      </g>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Chart 4: Dual Line Trend Ingress vs Egress -->
  <g transform="translate(16, 226)">
    <rect width="280" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">Ingress vs Egress</text>
    <g transform="translate(150, 20)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px">
      <text x="0" y="8" fill="#6366f1">— In 1.4G</text>
      <text x="54" y="8" fill="#06b6d4">┄ Out 860M</text>
    </g>

    <g transform="translate(16, 52)">
      <!-- Ingress Area + Line -->
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40 L 248 130 L 0 130 Z" fill="url(#dualAreaGradEn)" />
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
      <!-- Egress Dashed Line -->
      <path d="M 0 100 Q 40 80, 80 92 T 160 65 T 220 54 T 248 70" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
      <circle cx="220" cy="20" r="3.5" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
      <circle cx="220" cy="54" r="3.5" fill="#06b6d4" stroke="#ffffff" stroke-width="1.8" />
      <line x1="0" y1="130" x2="248" y2="130" stroke="#e4e4e7" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 5: Horizontal Ranking Bar -->
  <g transform="translate(312, 226)">
    <rect width="280" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">Latency by Component</text>
    <text x="264" y="28" text-anchor="end" class="text-sub" font-size="10px">P95 ms</text>

    <!-- Bars -->
    <g transform="translate(16, 44)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
      <!-- Item 1 -->
      <text x="0" y="14" fill="#18181b">DB Pool Wait</text>
      <text x="248" y="14" text-anchor="end" font-weight="700" fill="#f43f5e">280ms</text>
      <rect x="0" y="20" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="20" width="210" height="6" rx="3" fill="#f43f5e" />

      <!-- Item 2 -->
      <text x="0" y="48" fill="#18181b">LLM Stream First Token</text>
      <text x="248" y="48" text-anchor="end" font-weight="700" fill="#f59e0b">195ms</text>
      <rect x="0" y="54" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="54" width="154" height="6" rx="3" fill="#f59e0b" />

      <!-- Item 3 -->
      <text x="0" y="82" fill="#18181b">Auth Gateway JWT</text>
      <text x="248" y="82" text-anchor="end" font-weight="700" fill="#6366f1">48ms</text>
      <rect x="0" y="88" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="88" width="55" height="6" rx="3" fill="#6366f1" />

      <!-- Item 4 -->
      <text x="0" y="116" fill="#18181b">Asset Cache Edge Hit</text>
      <text x="248" y="116" text-anchor="end" font-weight="700" fill="#10b981">12ms</text>
      <rect x="0" y="122" width="248" height="6" rx="3" fill="#f4f4f5" />
      <rect x="0" y="122" width="20" height="6" rx="3" fill="#10b981" />
    </g>
  </g>

  <!-- Chart 6: Semi-Circle Gauge -->
  <g transform="translate(608, 226)">
    <rect width="296" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">Cluster Memory Watermark</text>
    <rect x="220" y="16" width="60" height="18" rx="9" fill="#fffbeb" stroke="#fde68a" stroke-width="0.8" />
    <text x="250" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#d97706">Normal</text>

    <!-- Semi-Circle Gauge (center 120, 110) -->
    <g transform="translate(28, 48)">
      <!-- Radius = 70, Half Circumference = 219.9 -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="#f4f4f5" stroke-width="16" stroke-dasharray="219.9 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      <!-- Active Arc 78.4%: length = 172.4 -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="url(#gaugeGradEn)" stroke-width="16" stroke-dasharray="172.4 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      
      <!-- Values -->
      <text x="120" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24px" font-weight="800" fill="#18181b">78.4%</text>
      <text x="120" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a">15.6 / 20 TB used</text>
      <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a" text-anchor="middle">0%</text>
      <text x="200" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a" text-anchor="middle">100%</text>
    </g>
  </g>
</svg>
