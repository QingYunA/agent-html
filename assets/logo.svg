<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background: Deep Premium Obsidian Zinc -->
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#121215" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Top Specular Sheen (macOS App Icon Refinement) -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Micro-Precision Chamfer Rim (1.2px) -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71717a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3f3f46" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#27272a" stop-opacity="0.2" />
    </linearGradient>

    <!-- Vibrant Electric Cyan -> Indigo -> Violet Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Subtle AI Star Core Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Base Container (macOS R=52px) -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tileBg)" />
  <!-- Top Surface Sheen -->
  <rect x="12" y="12" width="232" height="116" rx="52" fill="url(#topSheen)" />
  <!-- Precision Rim -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="url(#tileBorder)" stroke-width="1.2" />

  <!-- 2. Pure Iconic Centerpiece: Code Brackets & AI Sparkle -->
  <g transform="translate(128, 128)">
    <!-- Left Bracket '<' -->
    <path d="M -38 -40 L -72 0 L -38 40" 
          fill="none" 
          stroke="url(#bracketGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Bracket '>' -->
    <path d="M 38 -40 L 72 0 L 38 40" 
          fill="none" 
          stroke="url(#bracketGrad)" 
          stroke-width="15" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Perfect Mathematical 4-Pointed AI Sparkle (Astroid Geometry) -->
    <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" 
          fill="url(#starGrad)" />

    <!-- Pure Center Core Node -->
    <circle cx="0" cy="0" r="4" fill="#4f46e5" />
  </g>
</svg>