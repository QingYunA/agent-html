<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto">
  <defs>
    <style>
      .card-bg { fill: #121215; stroke: #27272a; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #fafafa; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #a1a1aa; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
    </style>
    <!-- Area Trend Gradients -->
    <linearGradient id="areaGradIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="dualAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="440" rx="14" fill="#09090b" stroke="#27272a" stroke-width="1" />

  <!-- ================= ROW 1 ================= -->

  <!-- Chart 1: Area Trend Curve -->
  <g transform="translate(16, 16)">
    <rect width="280" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">24h 请求吞吐量 (TPS)</text>
    <text x="264" y="28" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px" font-weight="700" fill="#34d399">↑ +18.4%</text>
    
    <!-- SVG Area Curve -->
    <g transform="translate(16, 48)">
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38 L 248 130 L 0 130 Z" fill="url(#areaGradIndigo)" />
      <path d="M 0 95 Q 35 40, 70 70 T 135 50 T 200 24 T 248 38" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="135" cy="50" r="3.5" fill="#121215" stroke="#818cf8" stroke-width="2" />
      <circle cx="200" cy="24" r="4" fill="#818cf8" stroke="#fafafa" stroke-width="2" />
      <!-- Baseline grid -->
      <line x1="0" y1="130" x2="248" y2="130" stroke="#27272a" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 2: Column Histogram -->
  <g transform="translate(312, 16)">
    <rect width="280" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">阶段响应延迟分布 (ms)</text>
    <rect x="230" y="16" width="34" height="18" rx="9" fill="#27272a" />
    <text x="247" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#a1a1aa">P95</text>

    <!-- Bars -->
    <g transform="translate(16, 54)">
      <!-- Bar 1 -->
      <rect x="10" y="76" width="32" height="44" rx="4" fill="#64748b" opacity="0.6" />
      <text x="26" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#a1a1aa" text-anchor="middle">24ms</text>
      <!-- Bar 2 -->
      <rect x="60" y="48" width="32" height="72" rx="4" fill="#818cf8" opacity="0.8" />
      <text x="76" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#fafafa" text-anchor="middle">48ms</text>
      <!-- Bar 3 (Peak) -->
      <rect x="110" y="18" width="32" height="102" rx="4" fill="#a78bfa" />
      <text x="126" y="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="700" fill="#a78bfa" text-anchor="middle">92ms</text>
      <!-- Bar 4 -->
      <rect x="160" y="60" width="32" height="60" rx="4" fill="#818cf8" opacity="0.8" />
      <text x="176" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#fafafa" text-anchor="middle">35ms</text>
      <!-- Bar 5 -->
      <rect x="210" y="86" width="32" height="34" rx="4" fill="#64748b" opacity="0.6" />
      <text x="226" y="78" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#a1a1aa" text-anchor="middle">18ms</text>
      <!-- Baseline -->
      <line x1="0" y1="120" x2="248" y2="120" stroke="#27272a" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 3: Multi-Segment Donut -->
  <g transform="translate(608, 16)">
    <rect width="296" height="194" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">集群健康度全景占比</text>
    <rect x="210" y="16" width="70" height="18" rx="9" fill="#052e16" stroke="#166534" stroke-width="0.8" />
    <text x="245" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#4ade80">99.8% 达标</text>

    <!-- Donut SVG (center 65, 110) -->
    <g transform="translate(16, 50)">
      <circle cx="60" cy="65" r="46" fill="none" stroke="#27272a" stroke-width="15" />
      <!-- Circumference = 2*PI*46 ≈ 289.0 -->
      <!-- 65%: 187.8 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#34d399" stroke-width="15" stroke-dasharray="187.8 289" stroke-dashoffset="0" transform="rotate(-90 60 65)" />
      <!-- 25%: 72.2 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#fbbf24" stroke-width="15" stroke-dasharray="72.2 289" stroke-dashoffset="-187.8" transform="rotate(-90 60 65)" />
      <!-- 10%: 28.9 -->
      <circle cx="60" cy="65" r="46" fill="none" stroke="#fb7185" stroke-width="15" stroke-dasharray="28.9 289" stroke-dashoffset="-260" transform="rotate(-90 60 65)" />
      
      <!-- Center text -->
      <text x="60" y="62" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16px" font-weight="700" fill="#fafafa">1,280</text>
      <text x="60" y="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9px" fill="#71717a">节点</text>

      <!-- Legend -->
      <g transform="translate(130, 24)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
        <circle cx="6" cy="12" r="3.5" fill="#34d399" />
        <text x="16" y="16" fill="#a1a1aa">正常运行 65%</text>
        <text x="124" y="16" text-anchor="end" font-weight="700" fill="#fafafa">832</text>

        <circle cx="6" cy="38" r="3.5" fill="#fbbf24" />
        <text x="16" y="42" fill="#a1a1aa">负载预警 25%</text>
        <text x="124" y="42" text-anchor="end" font-weight="700" fill="#fafafa">320</text>

        <circle cx="6" cy="64" r="3.5" fill="#fb7185" />
        <text x="16" y="68" fill="#a1a1aa">异常降级 10%</text>
        <text x="124" y="68" text-anchor="end" font-weight="700" fill="#fafafa">128</text>
      </g>
    </g>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Chart 4: Dual Line Trend Ingress vs Egress -->
  <g transform="translate(16, 226)">
    <rect width="280" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">出入网络流量对冲</text>
    <g transform="translate(150, 20)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px">
      <text x="0" y="8" fill="#818cf8">— 入向 1.4G</text>
      <text x="64" y="8" fill="#22d3ee">┄ 出向 860M</text>
    </g>

    <g transform="translate(16, 52)">
      <!-- Ingress Area + Line -->
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40 L 248 130 L 0 130 Z" fill="url(#dualAreaGrad)" />
      <path d="M 0 75 Q 40 35, 80 55 T 160 35 T 220 20 T 248 40" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
      <!-- Egress Dashed Line -->
      <path d="M 0 100 Q 40 80, 80 92 T 160 65 T 220 54 T 248 70" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" />
      <circle cx="220" cy="20" r="3.5" fill="#818cf8" stroke="#fafafa" stroke-width="2" />
      <circle cx="220" cy="54" r="3.5" fill="#22d3ee" stroke="#121215" stroke-width="1.8" />
      <line x1="0" y1="130" x2="248" y2="130" stroke="#27272a" stroke-width="1" />
    </g>
  </g>

  <!-- Chart 5: Horizontal Ranking Bar -->
  <g transform="translate(312, 226)">
    <rect width="280" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">核心模块耗时排行</text>
    <text x="264" y="28" text-anchor="end" class="text-sub" font-size="10px">P95 ms</text>

    <!-- Bars -->
    <g transform="translate(16, 44)" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11px">
      <!-- Item 1 -->
      <text x="0" y="14" fill="#fafafa">DB 连接池等待</text>
      <text x="248" y="14" text-anchor="end" font-weight="700" fill="#fb7185">280ms</text>
      <rect x="0" y="20" width="248" height="6" rx="3" fill="#27272a" />
      <rect x="0" y="20" width="210" height="6" rx="3" fill="#fb7185" />

      <!-- Item 2 -->
      <text x="0" y="48" fill="#fafafa">大模型首字生成 (TTFT)</text>
      <text x="248" y="48" text-anchor="end" font-weight="700" fill="#fbbf24">195ms</text>
      <rect x="0" y="54" width="248" height="6" rx="3" fill="#27272a" />
      <rect x="0" y="54" width="154" height="6" rx="3" fill="#fbbf24" />

      <!-- Item 3 -->
      <text x="0" y="82" fill="#fafafa">网关鉴权校验 (JWT)</text>
      <text x="248" y="82" text-anchor="end" font-weight="700" fill="#818cf8">48ms</text>
      <rect x="0" y="88" width="248" height="6" rx="3" fill="#27272a" />
      <rect x="0" y="88" width="55" height="6" rx="3" fill="#818cf8" />

      <!-- Item 4 -->
      <text x="0" y="116" fill="#fafafa">边缘静态资源缓存</text>
      <text x="248" y="116" text-anchor="end" font-weight="700" fill="#34d399">12ms</text>
      <rect x="0" y="122" width="248" height="6" rx="3" fill="#27272a" />
      <rect x="0" y="122" width="20" height="6" rx="3" fill="#34d399" />
    </g>
  </g>

  <!-- Chart 6: Semi-Circle Gauge -->
  <g transform="translate(608, 226)">
    <rect width="296" height="198" rx="10" class="card-bg" />
    <text x="16" y="28" class="text-title">集群内存占用水位</text>
    <rect x="220" y="16" width="60" height="18" rx="9" fill="#451a03" stroke="#854d0e" stroke-width="0.8" />
    <text x="250" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" font-weight="600" fill="#fbbf24">正常负荷</text>

    <!-- Semi-Circle Gauge (center 148, 140) -->
    <g transform="translate(28, 48)">
      <!-- Radius = 70, Half Circumference = 219.9 -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="#27272a" stroke-width="16" stroke-dasharray="219.9 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      <!-- Active Arc 78.4%: length = 172.4 -->
      <circle cx="120" cy="110" r="70" fill="none" stroke="url(#gaugeGrad)" stroke-width="16" stroke-dasharray="172.4 440" stroke-dashoffset="0" transform="rotate(-180 120 110)" stroke-linecap="round" />
      
      <!-- Values -->
      <text x="120" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24px" font-weight="800" fill="#fafafa">78.4%</text>
      <text x="120" y="110" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a">已使用 15.6 / 20 TB</text>
      <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a" text-anchor="middle">0%</text>
      <text x="200" y="122" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10px" fill="#71717a" text-anchor="middle">100%</text>
    </g>
  </g>
</svg>
